<header class="bg-white border-b border-slate-200 shadow-xs">
    <!-- Clean Branding Banner -->
    <div class="w-full px-4 sm:px-6 py-2.5">
        <div class="flex items-center justify-between">
            
            <!-- Left: SDSF Department Logo + Institution Titles -->
            <div class="flex items-center gap-4">
                <img 
                    src="{{ url_for('static', filename='photo/departmentlogo_transparent.png') }}" 
                    alt="SDSF Logo" 
                    class="h-14 sm:h-16 w-auto object-contain"
                    onerror="this.onerror=null; this.src='/photo/departmentlogo_transparent.png';"
                >
                <div class="border-l border-slate-200 pl-4 hidden sm:block"></div>
                <div>
                    <p class="text-xs font-semibold tracking-wider text-slate-500 uppercase">
                        Devi Ahilya Vishwavidyalaya, Indore
                    </p>
                    <h1 class="text-lg sm:text-2xl font-bold text-slate-900 tracking-tight">
                        School of Data Science and Forecasting
                    </h1>
                </div>
            </div>

            <!-- Right: DAVV University Logo -->
            <div class="flex items-center">
                <img 
                    src="{{ url_for('static', filename='photo/davvLogo.png') }}" 
                    alt="DAVV Logo" 
                    class="h-14 sm:h-16 w-auto object-contain"
                    onerror="this.onerror=null; this.src='/photo/davvLogo.png';"
                >
            </div>

        </div>
    </div>

    <!-- Simple Navigation Bar -->
    <nav class="bg-slate-900 text-slate-200">
        <div class="w-full px-4 sm:px-6">
            <div class="flex items-center h-10 text-sm font-medium space-x-2">
                <a href="#" class="px-3 py-1.5 rounded-md text-white bg-indigo-600 hover:bg-indigo-700 transition-colors">
                    Theory Exam Panel
                </a>
                <a href="#" class="px-3 py-1.5 rounded-md text-slate-300 hover:text-white hover:bg-slate-800 transition-colors">
                    Comprehensive Viva
                </a>
            </div>
        </div>
    </nav>
</header>

<!-- Main content placeholder for child templates -->
<main class="min-h-[calc(100vh-180px)]">
    {% block body %}
    {% endblock %}
</main>

{% include 'footer.html' %}
